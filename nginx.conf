# Maps the Upgrade request header to the Connection value the backend needs:
# "upgrade" for WebSocket handshakes, "" (close) for normal HTTP. Canonical nginx pattern.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 7303;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 5m;

    # Proxy API calls to the backend service (same-origin → no CORS, cookies just work).
    location /api/ {
        proxy_pass http://clickup-backend:7302;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket upgrade — required for realtime notifications/chat
        # (/api/.../notifications/ws). Without these the socket 400s and live
        # messages only appear on refresh.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }

    # SPA fallback: route everything else to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
